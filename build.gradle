plugins {
    id 'java'
    id 'application'
}

group = 'de.fitconnectdemo'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'dev.fitko.fitconnect:sdk-client:4.0.0-rc.2'
    // matches the slf4j-api 2.0.x the SDK pulls in; sends SDK logs to the console
    implementation 'org.slf4j:slf4j-simple:2.0.19'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'de.fitconnectdemo.Main'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}
